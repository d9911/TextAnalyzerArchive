<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Test</title>
    <link rel="stylesheet" href="src/style/variables.css">
    <link rel="stylesheet" href="src/style/reset.css">
    <link rel="stylesheet" href="src/style/base.css">
    <link rel="stylesheet" href="src/style/components.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Quick Test</h1>
            <button class="btn theme-toggle" id="themeToggle">🌙</button>
        </header>
        
        <div class="main-content">
            <div class="stat-card">
                <div class="stat-value">Test</div>
                <div class="stat-label">Glass morphism test</div>
            </div>
        </div>
    </div>

    <script src="src/script/theme.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Quick test page loaded');
            
            // Simple theme manager for testing
            let currentTheme = 'light';
            
            function toggleTheme() {
                currentTheme = currentTheme === 'light' ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', currentTheme);
                localStorage.setItem('preferred-theme', currentTheme);
                
                const button = document.getElementById('themeToggle');
                if (button) {
                    button.textContent = currentTheme === 'dark' ? '☀️' : '🌙';
                }
                
                console.log('Theme toggled to:', currentTheme);
            }
            
            // Set up theme toggle
            const themeToggle = document.getElementById('themeToggle');
            if (themeToggle) {
                themeToggle.addEventListener('click', toggleTheme);
                console.log('Theme toggle event listener added');
            }
            
            // Initialize theme
            const savedTheme = localStorage.getItem('preferred-theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            currentTheme = savedTheme;
            
            const button = document.getElementById('themeToggle');
            if (button) {
                button.textContent = currentTheme === 'dark' ? '☀️' : '🌙';
            }
            
            console.log('Quick test initialized with theme:', currentTheme);
        });
    </script>
</body>
</html>
